<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fortune Spin — Demo Slot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <div class="stat-card">
        <span class="stat-label">KREDIT</span>
        <strong id="credit">1,000,000</strong>
      </div>

      <div class="logo">
        <div class="logo-small">✦ FORTUNE ✦</div>
        <div class="logo-main">SPIN</div>
      </div>

      <div class="stat-card jackpot-card">
        <span class="stat-label">JACKPOT</span>
        <strong id="jackpot">10,000,000</strong>
      </div>
    </header>

    <main class="machine">
      <div class="payline-side left" aria-hidden="true">
        <span class="p4">4</span><span class="p2">2</span><span class="p6">6</span>
        <span class="p8">8</span><span class="p1">1</span><span class="p9">9</span>
        <span class="p7">7</span><span class="p3">3</span><span class="p5">5</span>
      </div>

      <section class="reel-frame" aria-label="Slot 5 kali 3">
        <div id="reels" class="reels">
          <div class="reel" data-reel="0"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="1"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="2"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="3"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="4"><div class="reel-strip"></div></div>
        </div>
        <div id="win-lines" class="win-lines" aria-hidden="true"></div>
      </section>

      <div class="payline-side right" aria-hidden="true">
        <span class="p4">4</span><span class="p2">2</span><span class="p6">6</span>
        <span class="p8">8</span><span class="p1">1</span><span class="p9">9</span>
        <span class="p7">7</span><span class="p3">3</span><span class="p5">5</span>
      </div>
    </main>

    <section class="result-area">
      <div class="result-box">
        <span>WIN</span>
        <strong id="win">0</strong>
        <small id="message">Tekan SPIN untuk bermain</small>
      </div>
    </section>

    <footer class="controls">
      <button class="info-btn" id="infoBtn" type="button" title="Paytable">i</button>

      <div class="bet-control">
        <button id="betMinus" type="button" aria-label="Kurangi taruhan">−</button>
        <div class="bet-value">
          <span>TOTAL BET</span>
          <strong id="bet">10,000</strong>
        </div>
        <button id="betPlus" type="button" aria-label="Tambah taruhan">+</button>
      </div>

      <button class="max-btn" id="maxBet" type="button">MAX<br>BET</button>

      <button class="spin-btn" id="spinBtn" type="button">
        <strong>SPIN</strong>
        <span>HOLD FOR AUTO</span>
      </button>
    </footer>
  </div>

  <dialog id="paytableDialog">
    <div class="dialog-card">
      <button class="dialog-close" id="closeInfo" type="button">×</button>
      <h2>PAYTABLE</h2>
      <p>Demo kredit virtual. Tidak menggunakan uang asli.</p>
      <div id="paytable"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="game-engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
