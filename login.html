<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Login — MyGame</title><link rel="stylesheet" href="assets/style.css"></head><body>
<main class="app">
<div class="auth-wrap"><div class="auth">
<div class="brand"><img src="assets/logo.png"><b>My<i>Game</i></b></div>
<h1>Selamat Datang</h1><div class="sub">Masuk ke area member MyGame</div>
<form onsubmit="login(event)">
<div class="form-row"><label>Email / Username</label><input class="input" name="user" placeholder="Masukkan email atau username" autocomplete="username"></div>
<div class="form-row"><label>Password</label><input class="input" type="password" name="pass" placeholder="Masukkan password" autocomplete="current-password"></div>
<button class="gold-btn" type="submit">Masuk Sekarang</button>
</form>
<div class="switch">Belum punya akun? <a href="register.html">Daftar</a></div>
<div class="notice" style="margin-top:18px">Mode prototype: akun demo tersimpan di browser, belum terhubung Supabase.</div>
</div></div>
</main><div class="toast"></div>
<script src="assets/app.js"></script></body></html>
